
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            text-align: center;
        }

        #chat-box {
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .user {
            background: #e8f0fe;
        }

        .assistant {
            background: #f1f1f1;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My AI Agent</h1>

        <div id="chat-box"></div>

        <div class="input-row">
            <input
                id="user-input"
                type="text"
                placeholder="请输入你的问题..."
            >
            <input
                id="image-input"
                type="file"
                accept="image/*"
            >
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(role, content) {
            const message = document.createElement("div");

            message.className = `message ${role}`;
            message.textContent = content;

            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message) {
                return;
            }

            addMessage("user", message);

            userInput.value = "";
            sendBtn.disabled = true;

            try {
                const formData = new FormData();

            formData.append(
             "message",
             message
            );


            const imageFile =
            document.getElementById(
            "image-input"
            ).files[0];


            if(imageFile){
            formData.append(
            "image",
            imageFile
            );
            }


            const response = await fetch(
            "http://127.0.0.1:8000/chat",
            {
            method: "POST",
            body: formData
            }
            );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                addMessage(
                    "assistant",
                    data.answer || JSON.stringify(data)
                );

            } catch (error) {
                console.error(error);

                addMessage(
                    "assistant",
                    "请求失败，请检查后端服务是否启动。"
                );

            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);

        userInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
